# Hyprland Configuration - SyndraShell
# https://wiki.hyprland.org/

# Moniteurs
monitor=,preferred,auto,1

# Variables d'environnement
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

# Exécution au démarrage
exec-once = dunst
exec-once = awww-daemon
exec-once = ~/.config/SyndraShell/syndrashell.sh

# Input configuration
input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

# Apparence générale
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

# Décoration
decoration {
    rounding = 10

    # Légère opacité des fenêtres pour le style
    active_opacity = 0.95
    inactive_opacity = 0.88

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Animations
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layout Dwindle
dwindle {
    preserve_split = true
}

# Layout Master
master {
    new_status = master
}

# Règles de fenêtre
# Pour changer la résolution : modifier la ligne monitor= en haut
# Exemple : monitor=HDMI-A-1,1920x1080@60,0x0,1
# Pour trouver le nom du moniteur : hyprctl monitors

# ═══════════════════════════════════════════════════════════════
#  RACCOURCIS CLAVIER — SyndraShell
# ═══════════════════════════════════════════════════════════════
$mainMod = SUPER
$term = kitty

# ── Applications ───────────────────────────────────────────────
bind = $mainMod, Return, exec, $term
bind = $mainMod, R, exec, $term
bind = $mainMod, B, exec, opera
bind = $mainMod, V, exec, code
bind = $mainMod, E, exec, thunar
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, A, exec, python ~/.config/SyndraShell/launch-menu.py

# ── Session / fenêtres ─────────────────────────────────────────
bind = $mainMod, Q, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, Space, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# ── SyndraShell ────────────────────────────────────────────────
bind = $mainMod SHIFT, R, exec, syndra restart
bind = $mainMod CTRL, R, exec, hyprctl reload

# ── Captures d'écran ───────────────────────────────────────────
bind = , Print, exec, hyprshot -m output
bind = $mainMod, Print, exec, hyprshot -m region
bind = $mainMod SHIFT, S, exec, hyprshot -m region

# ── Volume (PipeWire / WirePlumber) ────────────────────────────
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Luminosité ─────────────────────────────────────────────────
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Média ──────────────────────────────────────────────────────
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ── Focus ──────────────────────────────────────────────────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Déplacer vers workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Déplacer/redimensionner avec souris
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
