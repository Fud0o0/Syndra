# SyndraShell — écran de verrouillage (hyprlock)

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    color = rgba(13, 17, 23, 1.0)
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(20, 26, 36, 0.85)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##9aa5b1">Mot de passe…</span>
    hide_input = false
    rounding = 18
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 96
    font_family = tabler-icons, sans-serif
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A %d %B')"
    color = rgba(154, 165, 177, 1.0)
    font_size = 22
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = SyndraShell
    color = rgba(137, 180, 250, 0.9)
    font_size = 16
    position = 0, 40
    halign = center
    valign = bottom
}
