name: syndra-default

services:
  # Portainer — gestion Docker via interface web
  portainer:
    image: portainer/portainer-ce:latest
    container_name: syndra-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data:
