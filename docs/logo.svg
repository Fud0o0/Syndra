<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Top curve of S -->
  <path d="M 120 80 Q 180 40 250 80 Q 290 100 290 140 Q 290 180 250 200 Q 180 220 130 200" fill="url(#purpleGradient)" filter="url(#softGlow)"/>
  
  <!-- Bottom curve of S -->
  <path d="M 150 200 Q 220 180 280 220 Q 320 240 320 280 Q 320 340 240 360 Q 150 385 100 340 Q 80 320 80 280" fill="url(#purpleGradient)" filter="url(#softGlow)"/>
  
  <!-- Top diagonal line accent -->
  <line x1="280" y1="60" x2="360" y2="140" stroke="url(#purpleGradient)" stroke-width="20" stroke-linecap="round" filter="url(#softGlow)"/>
  
  <!-- Bottom diagonal line accent -->
  <line x1="220" y1="260" x2="350" y2="350" stroke="url(#purpleGradient)" stroke-width="20" stroke-linecap="round" filter="url(#softGlow)"/>
</svg>
